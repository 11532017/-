    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      position: relative;
    }

    /* 右上角顯示樣式 */
    .top-right-tag {
      position: fixed;
      top: 18px;
      right: 24px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 1.05rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: #ffd369;
      backdrop-filter: blur(6px);
      z-index: 100;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 36px 32px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 10px;
      color: #ffd369;
    }

    p.subtitle {
      font-size: 0.95rem;
      color: #cccccc;
      margin-bottom: 24px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    input[type="date"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.9);
      color: #1a1a2e;
      font-size: 1rem;
      outline: none;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #f39c12, #e67e22);
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(243, 156, 18, 0.4);
    }

    .result-card {
      display: none;
      margin-top: 20px;
      padding: 22px;
      background: rgba(0, 0, 0, 0.28);
      border-radius: 14px;
      text-align: left;
      border-left: 4px solid #ffd369;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .zodiac-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 10px;
    }

    .zodiac-name {
      font-size: 1.45rem;
      font-weight: bold;
      color: #ffd369;
    }

    .zodiac-date {
      font-size: 0.85rem;
      color: #bbbbbb;
    }

    .fortune-item {
      margin-bottom: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .fortune-item span.label {
      color: #ffd369;
      font-weight: bold;
    }

    .sub-fortunes {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .sub-card {
      background: rgba(255, 255, 255, 0.06);
      padding: 12px 14px;
      border-radius: 10px;
    }

    .sub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      font-weight: bold;
      font-size: 0.95rem;
    }

    .sub-title {
      color: #ffd369;
    }

    .sub-stars {
      color: #ff9f43;
      letter-spacing: 1px;
    }

      font-size: 0.9rem;
      color: #e0e0e0;
      line-height: 1.45;

    function getZodiacIndex(month, day) {
      if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) return 0; // 摩羯
      if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) return 1;  // 水瓶
      if ((month === 2 && day >= 19) || (month === 3 && day <= 20)) return 2;  // 雙魚
      if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) return 3;  // 牡羊
      if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) return 4;  // 金牛
      if ((month === 5 && day >= 21) || (month === 6 && day <= 21)) return 5;  // 雙子
      if ((month === 6 && day >= 22) || (month === 7 && day <= 22)) return 6;  // 巨蟹
      if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return 7;  // 獅子
      if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return 8;  // 處女
      if ((month === 9 && day >= 23) || (month === 10 && day <= 23)) return 9; // 天秤
      if ((month === 10 && day >= 24) || (month === 11 && day <= 22)) return 10; // 天蠍
      return 11; // 射手
    }

    function checkHoroscope() {
      const input = document.getElementById("birthday").value;
      if (!input) {
        alert("請先選擇您的生日！");
        return;
      }

      const parts = input.split("-");
      const month = parseInt(parts[1], 10);
      const day = parseInt(parts[2], 10);

      const index = getZodiacIndex(month, day);
      const data = horoscopes[index];

      document.getElementById("zodiacName").textContent = data.name;
      document.getElementById("zodiacDate").textContent = data.range;
      document.getElementById("stars").textContent = data.stars;
      document.getElementById("luckyColor").textContent = data.color;
      document.getElementById("luckyNumber").textContent = data.number;
      document.getElementById("fortuneText").textContent = data.text;

      document.getElementById("loveStars").textContent = data.loveStars;
      document.getElementById("loveText").textContent = data.loveText;
      document.getElementById("careerStars").textContent = data.careerStars;
      document.getElementById("careerText").textContent = data.careerText;
      document.getElementById("wealthStars").textContent = data.wealthStars;
      document.getElementById("wealthText").textContent = data.wealthText;

      const resultCard = document.getElementById("result");
      resultCard.style.display = "none";
      void resultCard.offsetWidth;
      resultCard.style.display = "block";

</html>
